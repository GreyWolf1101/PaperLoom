name: Bug 报告
description: 报告可复现的软件问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿在 Issue 中填写 API Key、私人文献或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: PaperLoom 版本
      placeholder: 例如 0.9.2
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: 运行方式
      options:
        - 安装版
        - 便携版
        - 本地开发版
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 阅读主题
      options:
        - 论文阅读
        - 文章小说阅读
        - AI 创作
        - 不适用
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序描述操作过程。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 系统与文件信息
      description: Windows 版本、文件格式和大致页数；请勿上传含隐私的原文件。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已移除 API Key、个人信息和私人文献内容。
          required: true
