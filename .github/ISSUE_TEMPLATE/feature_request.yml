name: 功能建议
description: 提议新的阅读、研究或创作能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 请说明这个功能要解决谁的什么问题。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述期望交互、输入与输出。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 如果考虑过其他实现方式，可以写在这里。
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意进一步讨论设计。
        - label: 我愿意尝试提交 Pull Request。
